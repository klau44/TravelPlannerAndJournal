spring.application.name=TravelPlannerAndJournalspring.jpa.show-sql=true
server.servlet.context-path=/api
spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.format_sql=true

# MySQL
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/travelPlannerJournal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SQL_USERNAME}
spring.datasource.password=${SQL_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# GEOAPIFY
geoapify.api-key=${GEOAPIFY_API_KEY}
geoapify.base-url=https://api.geoapify.com